name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          # API key from repo secrets — set it in repo Settings → Secrets and variables → Actions
          VITE_DROPEA_API_KEY: ${{ secrets.VITE_DROPEA_API_KEY }}
          VITE_DROPEA_SHOP_ID: ${{ secrets.VITE_DROPEA_SHOP_ID }}
          VITE_PUBLIC_SITE_URL: https://eddyflores100-lang.github.io/dropes-v2
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Add 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
