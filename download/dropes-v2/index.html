<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc2626" />

    <!-- Primary SEO meta tags -->
    <title>Dropes — Tienda Online Premium | Envío 24h España y Portugal</title>
    <meta
      name="description"
      content="Dropes: catálogo premium de productos para el hogar, belleza, tecnología y cocina. Envío gratis en 24h a toda España y Portugal. Contra reembolso o tarjeta."
    />
    <meta name="keywords" content="dropes, dropshipping, tienda online, españa, portugal, envío 24h, InnovaGoods" />
    <meta name="author" content="Dropes" />
    <link rel="canonical" href="https://dropes.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dropes — Tienda Online Premium" />
    <meta
      property="og:description"
      content="Catálogo premium con envío gratis en 24h a España y Portugal. Contra reembolso o tarjeta."
    />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://dropes.example.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dropes — Tienda Online Premium" />
    <meta
      name="twitter:description"
      content="Catálogo premium con envío gratis en 24h a España y Portugal."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Dropes",
        "url": "https://dropes.example.com/",
        "areaServed": ["ES", "PT"],
        "currenciesAccepted": "EUR",
        "paymentAccepted": "Cash on Delivery, Credit Card, Bizum"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
